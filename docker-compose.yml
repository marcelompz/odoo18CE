services:
  web:
    container_name: odoo_web_8082
    image: odoo:18.0
    depends_on:
      - db
    ports:
      - "8082:8069"
      - "8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons:ro
      - /srv/odoo-modules/l10n_py:/mnt/extra-addons-l10n:ro  # Clone from github.com/marcelompz/odoo-l10n-py
    command: >
      bash -c "pip3 install --break-system-packages tu-ruc-python-client && odoo --addons-path=/mnt/extra-addons,/mnt/extra-addons-l10n,/usr/lib/python3/dist-packages/odoo/addons --db_host=${DB_HOST} --db_port=${DB_PORT} --db_user=${DB_USER} --db_password=${DB_PASSWORD}"
    environment:
      # Database (from .env)
      - HOST=${DB_HOST:-db}
      - PORT=${DB_PORT:-5432}
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWORD:-crossdimora.159753}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-odoo}
      - DB_PASSWORD=${DB_PASSWORD:-crossdimora.159753}

      # Odoo Configuration
      - ODOO_DB_FILTER=${ODOO_DB_FILTER:-^prod$}
      - ODOO_ADMIN_PASSWD=${ODOO_ADMIN_PASSWD:-soportecrossdimora.159753}

      # Performance
      - WORKERS=2
      - LIMIT_MEMORY_HARD=2684354560
      - LIMIT_MEMORY_SOFT=2147483648
      - LIMIT_REQUEST=100
      - LIMIT_TIME_CPU=600
      - LIMIT_TIME_REAL=1200

      # System
      - TZ=America/Asuncion
      - ODOO_LOG_LEVEL=info

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/database/selector"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  db:
    container_name: db_odoo_5434
    image: postgres:15
    environment:
      - POSTGRES_DB=${DB_NAME:-postgres}
      - POSTGRES_USER=${DB_USER:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-crossdimora.159753}
      - TZ=${TZ:-America/Asuncion}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d ${DB_NAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  init:
    container_name: odoo_init_db
    image: odoo:18.0
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./addons:/mnt/extra-addons:ro
      - /srv/odoo-modules/l10n_py:/mnt/extra-addons-l10n:ro
      - ./init_prod_db.sh:/init_prod_db.sh:ro
    environment:
      - DB_NAME=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWD=crossdimora.159753
      - ADMIN_EMAIL=soporte@crossnexion.com
      - ADMIN_PASSWORD=Cross1983_
    command: >
      bash -c "
        pip3 install --break-system-packages tu-ruc-python-client &&
        bash /init_prod_db.sh &&
        touch /tmp/init_completed
      "
    restart: "no"

volumes:
  odoo-db-data:
  odoo-web-data:
