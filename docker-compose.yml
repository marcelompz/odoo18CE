services:
  web:
    container_name: odoo_web_8082
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8069"
      - "8072:8072"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ${WEB_ADDONS_CUSTOMIZE:-./addons}:/mnt/extra-addons-customize:ro
    entrypoint: "/entrypoint.sh"
    environment:
      - HOST=db_odoo_5434
      - USER=${DB_USER:-odoo}
      - PASSWORD=${DB_PASSWD:-crossdimora.159753}
      - TZ=${TZ:-America/Asuncion}
      - DEBIAN_FRONTEND=noninteractive
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/database/selector"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    container_name: db_odoo_5434
    image: postgres:${DB_TAG:-15}
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${DB_USER:-odoo}
      - POSTGRES_PASSWORD=${DB_PASSWD:-crossdimora.159753}
      - TZ=${TZ:-America/Asuncion}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "5434:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  odoo-db-data:
    driver: local
    driver_opts:
      type: none
      device: ${DB_VOLUMES:-/opt/odoo/odoo8082/db-data}
      o: bind
  odoo-web-data:
    driver: local
    driver_opts:
      type: none
      device: ${WEB_VOLUMES:-/opt/odoo/odoo8082/web-data}
      o: bind
