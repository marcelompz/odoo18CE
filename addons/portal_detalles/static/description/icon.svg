<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fondo -->
  <rect width="128" height="128" rx="20" fill="url(#gradient)"/>
  
  <!-- Documento -->
  <rect x="25" y="20" width="78" height="88" rx="8" fill="white" stroke="#333" stroke-width="2"/>
  
  <!-- Líneas del documento -->
  <rect x="35" y="35" width="58" height="3" rx="1.5" fill="#667eea"/>
  <rect x="35" y="45" width="48" height="3" rx="1.5" fill="#764ba2"/>
  <rect x="35" y="55" width="52" height="3" rx="1.5" fill="#667eea"/>
  <rect x="35" y="65" width="45" height="3" rx="1.5" fill="#764ba2"/>
  <rect x="35" y="75" width="50" height="3" rx="1.5" fill="#667eea"/>
  
  <!-- Portal/Globo -->
  <circle cx="85" cy="35" r="12" fill="#28a745" stroke="white" stroke-width="2"/>
  <text x="85" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">P</text>
  
  <!-- Gradiente -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
